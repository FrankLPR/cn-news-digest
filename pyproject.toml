[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cn-news-digest"
version = "0.1.0"
description = "Fetch and summarize hot investment news from Chinese financial sources"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "httpx>=0.27",
    "feedparser>=6.0",
    "click>=8.0",
]

[project.scripts]
cn-news-digest = "cn_news_digest.cli:main"

[project.optional-dependencies]
browser = [
    "playwright>=1.40",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "respx>=0.22",
]
